name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requires AWS_DEPLOY_ROLE_ARN (OIDC, not static access keys) and
      # AWS_REGION repo secrets once infra/terraform has actually been applied.
      # Until then this step fails here by design — nothing downstream runs.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/job-hunt-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/job-hunt-web:${{ github.sha }}

  deploy-stub:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Uncomment once infra/terraform/envs/prod has been applied and the ECS
      # cluster/services below actually exist. Left as a stub so this workflow
      # is reviewable without ever running `aws ecs update-service` against a
      # live account.
      - name: Echo deploy commands (not executed)
        run: |
          echo "aws ecs update-service --cluster job-hunt-copilot-cluster --service job-hunt-copilot-api --force-new-deployment"
          echo "aws ecs update-service --cluster job-hunt-copilot-cluster --service job-hunt-copilot-web --force-new-deployment"
